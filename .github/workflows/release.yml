name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-onefile-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Build single-file exe
        run: uv run pyinstaller --noconfirm --clean taggycat.spec

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/taggycat.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  taggycat.exe" | Out-File -Encoding ascii dist/taggycat.exe.sha256
          Get-Content dist/taggycat.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: taggycat-windows-x64
          path: |
            dist/taggycat.exe
            dist/taggycat.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/taggycat.exe
            dist/taggycat.exe.sha256
            LICENSE
            NOTICE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

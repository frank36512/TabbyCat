name: 问题反馈
description: 报告崩溃、功能异常或界面错乱
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue。**不要粘贴 API Key、内网地址或含个人隐私的日志片段**；
        日志中若有密钥请先打码。
  - type: dropdown
    id: mode
    attributes:
      label: 运行方式
      options:
        - 单文件 exe（dist/taggycat.exe）
        - 源码运行（uv run taggycat ...）
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 关于框显示的版本号，或 git commit / tag
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: Windows 版本、Python 版本、FFmpeg 版本
      placeholder: "Windows 11 / Python 3.12 / FFmpeg 8.0"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步步描述操作，尽量给出素材类型与目标时长
      placeholder: |
        1. 添加视频 ...
        2. 选择风格 ...
        3. 点击开始任务 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / 报错日志
      description: 可粘贴「帮助 → 运行日志」内容，注意打码
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已运行 `uv run taggycat doctor` 并检查过常见环境问题
          required: false
        - label: 我已确认日志中不含密钥与个人隐私信息
          required: true

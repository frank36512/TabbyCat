name: 功能建议
description: 提出新功能、新解说风格或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述当前流程中的痛点或缺失能力
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 描述你希望的行为，若有同类工具可参考请附链接
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 流水线 / 文案质量
        - 配音 / 字幕 / 成片
        - 桌面界面
        - 配置 / 接口接入
        - 打包与发布
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或补充信息
    validations:
      required: false
